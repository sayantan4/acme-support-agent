[project]
name = "gmail-inbox-webhooks"
version = "0.1.0"
description = "Receive Gmail inbox-change notifications via Cloud Pub/Sub push and sync new messages."
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    "gunicorn>=22",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "google-api-python-client>=2.120",
    "google-auth>=2.28",
    "google-auth-oauthlib>=1.2",
    "google-cloud-pubsub>=2.21",
    "requests>=2.31",
    "cryptography>=42",
    "redis>=5.0",
    "openai>=1.50",
    "bm25s>=0.3.11",
    "psycopg[binary]>=3.2",
    "prometheus-client>=0.20",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "fakeredis>=2.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
# Upper bounds: the versions this project was tested with.
constraint-dependencies = [
    "httpx2<2.13.1",
    "openai<3.16.2",
    "google-api-core<2.39.0",
    "google-auth<2.58.1",
    "googleapis-common-protos<1.75.4",
    "idna<3.20",
    "protobuf<7.36.2",
    "pyparsing<3.3.3",
    "tzdata<2026.5",
]
